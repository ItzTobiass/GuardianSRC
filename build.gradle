plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'org.mrqendyxz'
version = '1.1.9'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "codemc-repo"
        url = "https://repo.codemc.io/repository/maven-releases/"
    }
}

dependencies {
    implementation("org.bstats:bstats-bukkit:3.2.1")
    compileOnly("org.spigotmc:spigot-api:1.21-R0.1-SNAPSHOT")
    testImplementation("org.spigotmc:spigot-api:1.21-R0.1-SNAPSHOT")
    implementation("com.github.retrooper:packetevents-spigot:2.9.5")
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.register('regressionTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.mrqendyxz.guardianv3.RegressionTests'
}
check.dependsOn regressionTest

tasks.named('jar') {
    archiveClassifier.set('plain')
}
tasks.named('shadowJar') {
    archiveClassifier.set('')
    configurations = [project.configurations.runtimeClasspath]
    dependencies {
        exclude { it.moduleGroup != 'org.bstats' }
    }
    relocate 'org.bstats', 'org.mrqendyxz.guardianv3.libs.bstats'
}
tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
